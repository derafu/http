# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/http/resources/config/http-services.yaml' }
#
# It has what is the same in every app. What depends on the app stays in the
# app: the list (and the order) of the middlewares that the request handler
# runs (`Psr\Http\Server\RequestHandlerInterface`), the directory of the static
# files (`StaticFilesMiddleware`) and the services of the other packages, like
# the router.
#
# Who the client of a request is (`ClientIpMiddleware`) is configured with the
# environment variables HTTP_TRUSTED_PROXIES, HTTP_CLIENT_IP_HEADERS,
# HTTP_CLIENT_NETWORK_IPV4_PREFIX and HTTP_CLIENT_NETWORK_IPV6_PREFIX.

parameters:
    # The pages of the errors in HTML (see ProblemHandler): the handler of each
    # status (404, 500...) and `default`, for the statuses that have none. A
    # handler is the path of a template or a `Controller::action`; the problem
    # is passed to it as `context.error`. Without pages the errors in HTML are
    # sent as Markdown. They are not routes: a page of an error is not a URL.
    http.error_pages: []
    # Who the client of a request is (see ClientIpMiddleware). The proxies that
    # the application trusts, separated by commas: addresses, ranges (CIDR) and
    # the shortcuts `loopback`, `private` and `link-local`. By default there are
    # none: the client is the address of the connection and no header is read.
    env(HTTP_TRUSTED_PROXIES): ''
    # The headers with the address of the client, separated by commas, in order of
    # preference. They are read only when the connection comes from a trusted
    # proxy.
    env(HTTP_CLIENT_IP_HEADERS): 'X-Forwarded-For'
    # The bits of the network of the client that the limits count by.
    env(HTTP_CLIENT_NETWORK_IPV4_PREFIX): '32'
    env(HTTP_CLIENT_NETWORK_IPV6_PREFIX): '64'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Derafu\Http\Middleware\RequestFactoryMiddleware: ~
    Derafu\Http\Middleware\ClientIpMiddleware:
        arguments:
            $trustedProxies: '%env(csv:HTTP_TRUSTED_PROXIES)%'
            $headers: '%env(csv:HTTP_CLIENT_IP_HEADERS)%'
            $ipv4Prefix: '%env(int:HTTP_CLIENT_NETWORK_IPV4_PREFIX)%'
            $ipv6Prefix: '%env(int:HTTP_CLIENT_NETWORK_IPV6_PREFIX)%'
    Derafu\Http\Middleware\RouterMiddleware: ~
    Derafu\Http\Middleware\DispatcherMiddleware: ~
    Derafu\Http\Middleware\ResponseNormalizerMiddleware: ~

    Derafu\Http\Contract\RequestFactoryInterface:
        class: Derafu\Http\Factory\RequestFactory

    Derafu\Http\Contract\DispatcherInterface:
        class: Derafu\Http\Service\Dispatcher

    Derafu\Http\Contract\ProblemHandlerInterface:
        class: Derafu\Http\Service\ProblemHandler
        lazy: true
        arguments:
            $pages: '%http.error_pages%'

    Derafu\Http\Contract\ProblemFactoryInterface:
        class: Derafu\Http\Factory\ProblemFactory
        lazy: true

    Derafu\Http\Contract\SafeThrowableFactoryInterface:
        class: Derafu\Http\Factory\SafeThrowableFactory
        lazy: true

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Http\Translation\HttpTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
